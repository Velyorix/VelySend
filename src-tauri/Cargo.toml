[package]
name = "velysend-mailer"
version = "0.1.0"
description = ""
authors = ["Velyorix"]
license = "MIT"
repository = "https://github.com/Velyorix/VelySend"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.7", features = [] }

anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs"] }

sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "chrono", "migrate"] }
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "smtp-transport",
    "tokio1",
    "tokio1-rustls-tls",
] }
argon2 = { version = "0.5", features = ["std"] }
ring = "0.17"
rand = "0.8"
base64 = "0.22"
keyring = "2"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
walkdir = "2"
tauri-plugin-log = "2.7.0"
aes-gcm = "0.11.0-rc.1"
